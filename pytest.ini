[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -p no:cacheprovider -q
# Tests never touch the network, speakers, the real SAM_HOME or live apps.
# Live checks live under acceptance/ and are run by hand on this PC.
markers =
    live: needs real apps/network on this PC (skipped unless SAM_LIVE=1)
filterwarnings =
    ignore::DeprecationWarning:comtypes.*
