# SAM's normalized gateway. Every model name SAM asks for is defined here, so the
# Trading Brain never names a provider directly.
#
# The OpenRouter entries read the key from the process environment. LiteLLM is
# started by start.ps1, which inherits whatever SAM itself resolved, so a key set
# in the environment or written to SAM's secret store reaches the gateway without
# ever being written into this file.
model_list:
  # --- Local, always available -------------------------------------------
  - model_name: sam-fast
    litellm_params:
      model: ollama_chat/qwen3.5:4b
      api_base: http://127.0.0.1:11434
    model_info:
      mode: chat
      supports_function_calling: true

  - model_name: sam-local-strong
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: http://127.0.0.1:11434
    model_info:
      mode: chat
      supports_function_calling: true

  - model_name: sam-vision
    litellm_params:
      model: ollama_chat/qwen3-vl:8b
      api_base: http://127.0.0.1:11434
    model_info:
      mode: chat
      supports_vision: true

  # --- Cloud, used when a credential is present --------------------------
  - model_name: sam-strong
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4.5
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      mode: chat
      supports_function_calling: true

  - model_name: sam-cloud-fast
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      mode: chat
      supports_function_calling: true

  - model_name: sam-cloud-vision
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4.5
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      mode: chat
      supports_vision: true

litellm_settings:
  drop_params: true
  set_verbose: false
  # When the cloud model is unreachable or unauthenticated, fall back to the
  # local model rather than failing the request outright.
  fallbacks:
    - sam-strong: ["sam-local-strong", "sam-fast"]
    - sam-cloud-fast: ["sam-fast"]
    - sam-cloud-vision: ["sam-vision"]
  request_timeout: 180
  num_retries: 1

general_settings:
  disable_spend_logs: false
