name: CI

# SAM is a Windows desktop agent: its Win32 window discovery, screen capture,
# Windows OCR and desktop input only exist on Windows, so the first runner is
# Windows. A portability job would be a separate decision, not symmetry.
on:
  pull_request:
  push:
    branches:
      - main
      - release/sam-stabilization

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    name: Windows tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # 3.14 is what produced the local baseline this suite is measured against,
      # and requirements-lock.txt is pinned against it. README requires 3.11+.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # Both files already exist in the repository; no package list is repeated
      # here. The lock file is the install setup.ps1 performs and is the only
      # complete one -- it alone carries Pillow, pywin32, psutil, MetaTrader5
      # and pytest. requirements-dev.txt is the declared dev/test contract and
      # adds what the suite needs beyond the lock, so it is applied second.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -r sam_backend/requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check frontend syntax
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem frontend/*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax error in $($_.Name)" }
            Write-Host "ok $($_.Name)"
          }
